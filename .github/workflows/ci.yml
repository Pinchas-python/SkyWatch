name: SkyWatch CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend
        run: docker build -t skywatch-frontend:ci ./app/frontend

      - name: Build Worker
        run: docker build -t skywatch-worker:ci ./app/worker

      - name: Validate Docker Compose
        run: docker compose config -q
